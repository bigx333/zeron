[package]
name = "zeron-markdown"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Block-level markdown model + append-incremental reparse. Shared by the gpui
# desktop transcript and the mobile layout core, so it stays UI-free. The
# `@chat:` reference scanner is shared wire vocabulary in zeron-proto, so the
# parser marks references exactly where the engine and CLI see them.
[dependencies]
pulldown-cmark.workspace = true
zeron-proto.workspace = true
